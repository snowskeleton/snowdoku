name: Snowdoku
options:
  bundleIdPrefix: net.snowskeleton
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  # Matches Xcode's "recommended settings" upgrade so it isn't offered again.
  xcodeVersion: "27.2"
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  SudokuCore:
    path: Engine
targets:
  Snowdoku:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      # Synced folder: files added under App/ show up in Xcode without regenerating.
      - path: App
        type: syncedFolder
    dependencies:
      - package: SudokuCore
        product: SudokuCore
      - sdk: GameKit.framework
    entitlements:
      path: Snowdoku.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.snowskeleton.snowdoku
        PRODUCT_NAME: Snowdoku
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Snowdoku
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PK7HCG46US
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        # Game Center talks to Apple's servers.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  SnowdokuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        type: syncedFolder
    dependencies:
      - target: Snowdoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.snowskeleton.snowdoku.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Snowdoku
schemes:
  Snowdoku:
    build:
      targets:
        Snowdoku: all
    test:
      targets: [SnowdokuUITests]
